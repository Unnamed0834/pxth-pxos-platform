title = "Public release"

[extend]
useDefault = true

[[rules]]
id = "age-secret-key"
description = "age private key"
regex = '''AGE-SECRET-KEY-1[1-9A-Za-z]{20,}'''

[[rules]]
id = "private-key-block"
description = "PEM/OpenSSH private key"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH |OPENPGP )?PRIVATE KEY-----'''

[[rules]]
id = "internal-domain"
description = "internal domain"
regex = '''[A-Za-z0-9-]+\.(int|internal)\.[a-z]{2,}'''

[[rules]]
id = "private-address"
description = "private address"
regex = '''(^|[^0-9])10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}([^0-9]|$)'''

[allowlist]
paths = [
  '''\.gitleaks\.toml$''',
  '''tools/check-repo\.sh$''',
  '''tests/.*''',
]
